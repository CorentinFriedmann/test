<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESTRAN</title>
<style>
  :root { --ink: #cfe3ee; --dim: #5d7686; --accent: #8fd3c8; --warn: #e6b86a; --bg: #05090d; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud svg { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #gauge { position: absolute; left: 22px; top: 22%; bottom: 22%; width: 14px; border: 1.5px solid var(--ink); border-radius: 8px; background: rgba(5,9,13,.45); }
  #gauge-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(#4f8fb8, #2b5c80); border-radius: 0 0 6px 6px; }
  #hud #gauge-chevron { position: absolute; left: 22px; width: 18px; height: 18px; fill: var(--ink); stroke: none; transition: transform .2s; }
  #pastilles { position: absolute; right: 22px; top: 20px; display: flex; gap: 10px; }
  .pastille { width: 34px; height: 34px; padding: 4px; border-radius: 50%; border: 1.5px solid var(--dim); background: rgba(5,9,13,.45); box-sizing: border-box; }
  .pastille.todo { opacity: .6; }
  .pastille.read { background: var(--accent); border-color: var(--accent); }
  .pastille.read path { stroke: var(--bg); }
  .pastille.now { border-color: var(--warn); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(230,184,106,.25); } }
  #lamp { position: absolute; right: 22px; bottom: 22px; display: flex; align-items: center; gap: 8px; opacity: .55; }
  #lamp.on { opacity: 1; }
  #lamp svg { width: 24px; height: 24px; }
  #lamp-bar { width: 70px; height: 6px; border: 1.2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  #lamp-fill { height: 100%; width: 100%; background: var(--ink); }
  #phare { position: absolute; right: 22px; bottom: 56px; display: flex; align-items: center; gap: 8px; }
  #phare svg { width: 24px; height: 24px; }
  #phare-bar { width: 70px; height: 6px; border: 1.2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  #phare-fill { height: 100%; width: 100%; background: var(--warn); }
  #phare.low { animation: flick .45s steps(2, end) infinite; }
  #phare.low #phare-fill { background: #d9694a; }
  @keyframes flick { 50% { opacity: .35; } }
  #vignette-cold { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(40,110,200,0) 30%, rgba(40,110,200,.55) 100%); }
  #ring { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; }
  #ring-bg { opacity: 0; stroke-width: 2.2; }
  #ring.active #ring-bg { opacity: .3; }
  #ring-fg { opacity: 0; stroke: var(--accent); stroke-width: 3; transform: rotate(-90deg); transform-origin: 24px 24px; }
  #ring.active #ring-fg { opacity: 1; }
  #ring-dot { fill: var(--ink); stroke: none; opacity: .8; }
  #vignette-drown { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,5,12,0) 25%, rgba(0,5,12,.97) 100%); }
  #objective { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; font-size: 17px; letter-spacing: .04em; opacity: 0; transition: opacity 1s; text-shadow: 0 0 6px #000; }
  #objective.on { opacity: .9; }
  #card { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(2,5,9,.72); gap: 18px; }
  #card.on { display: flex; }
  #card-text { font-size: 30px; letter-spacing: .06em; }
  #card-hint { font-size: 14px; border: 1.5px solid var(--dim); border-radius: 6px; padding: 3px 11px; color: var(--dim); }
  #captions { position: fixed; left: 0; right: 0; bottom: 21%; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .cap { background: rgba(5,9,13,.72); padding: 3px 12px; border-radius: 4px; font-size: 16px; letter-spacing: .02em; }
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; text-shadow: 0 0 6px #000; }
  #toast.on { opacity: .9; }
  #opts { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: var(--dim); cursor: default; }
  #opts label { cursor: pointer; display: flex; align-items: center; gap: 8px; }
  #debug { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 monospace; white-space: pre; text-shadow: 0 0 4px #000; pointer-events: none; display: none; }
  #intro { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
           background: rgba(0,0,0,.6); cursor: pointer; font-size: 16px; line-height: 1.8; }
  #intro.hidden { display: none; }
  #intro small { color: var(--dim); }
  #intro { overflow-y: auto; align-items: flex-start; }
  #intro > div { margin: auto; padding: 16px; max-width: 880px; }
  #p2bar { margin-top: 18px; cursor: default; }
  #p2bar textarea, .p2panel textarea { width: min(640px, 92vw); box-sizing: border-box; font: 12px/1.4 ui-monospace, monospace; background: #0b141b; color: var(--ink); border: 1px solid var(--dim); border-radius: 6px; padding: 6px; }
  .p2btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: #10202b; border: 1px solid var(--dim); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
  .p2msg { min-height: 1.4em; margin-top: 6px; font-size: 13px; color: var(--warn); }
  .p2panel { position: fixed; inset: 0; z-index: 40; display: none; overflow-y: auto; background: #05090d; font-size: 15px; line-height: 1.5; text-align: left; }
  .p2panel.on { display: block; }
  .p2inner { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  .p2inner h2 { letter-spacing: .1em; font-size: 22px; }
  .p2note { color: var(--dim); }
  .p2q { border: 1px solid #243442; border-radius: 8px; margin: 14px 0; padding: 8px 14px 12px; }
  .p2q legend { padding: 0 6px; color: var(--accent); }
  .p2row { margin-top: 8px; }
  .p2lab { font-size: 13px; color: var(--dim); margin-bottom: 3px; }
  .p2choices { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .p2choices label { cursor: pointer; }
  .p2panel textarea { width: 100%; }
  #credits pre { white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; color: var(--dim); }
</style>
</head>
<body>
<div id="hud"></div>
<div id="debug"></div>
<div id="captions" aria-live="polite"></div>
<div id="toast" role="status"></div>
<div id="intro"><div><b style="font-size:28px;letter-spacing:.2em">ESTRAN</b><br><br>Cliquez pour jouer<br>
<small>ZQSD / WASD : se déplacer · souris : regarder · Maj : courir · C : marcher lentement · F : lampe · E (maintenir) : interagir<br>R : recommencer · M : couper le son · K : sous-titres des bruits · F2 : mesure de performance · Échap : pause</small>
<div id="opts"><label>Volume <input id="opt-vol" type="range" min="0" max="100" value="80"></label>
<label><input id="opt-mute" type="checkbox"> Son coupé</label>
<label><input id="opt-cap" type="checkbox"> Sous-titres des bruits</label></div>
<div id="p2bar"><div class="p2btns"><button id="p2-form" type="button">Questionnaire (8 questions)</button>
<button id="p2-perf" type="button">Copier le rapport de performance</button>
<button id="p2-credits" type="button">Crédits et licences</button></div>
<div id="p2-msg" class="p2msg" role="status"></div><textarea id="p2-out" readonly rows="8" style="display:none"></textarea></div></div></div>
<script type="text/plain" id="licence-three"><!--LICENCE_THREE--></script>
<!--APP-->
</body>
</html>
